name: CI

on:
  push:
  pull_request:
  # Deploy main by hand, e.g. after starting the server
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      # Offline: tests/conftest.py forces the stub extractor and in-process records
      - run: python -m pytest -q

  frontend:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  deploy:
    name: Deploy to the prototype server
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      INSTANCE_ID: ${{ vars.DEPLOY_INSTANCE_ID }}
      DOCUMENT: ${{ vars.DEPLOY_DOCUMENT }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
      - name: Deploy if the server is running
        run: |
          state=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' --output text)
          if [ "$state" != running ]; then
            echo "::notice::The server is $state, so nothing was deployed. Start it, then run this workflow on main."
            exit 0
          fi
          id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name "$DOCUMENT" \
            --document-version '$LATEST' --comment "deploy ${GITHUB_SHA::7}" \
            --query Command.CommandId --output text)
          for _ in $(seq 1 180); do
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          [ "$status" = Success ] || { echo "::error::Deploy ended with status $status"; exit 1; }
