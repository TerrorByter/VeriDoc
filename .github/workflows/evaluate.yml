name: Run evaluation

# Scores the code deployed on the prototype server against every demo pack and
# saves the reports its Model & controls page shows (Actions > Run evaluation >
# Run workflow). The rules evaluation costs nothing; the AI team calls Bedrock
# for every pack and run (about US$3 a run over the twelve packs). The server
# must be running: start it with the Start server workflow first.
on:
  workflow_dispatch:
    inputs:
      ai-team:
        description: Also run the AI team over every pack (about US$3 a run)
        type: boolean
        default: false
      runs:
        description: How many times the AI team runs each pack (it is not deterministic)
        type: choice
        options: ["1", "2", "3"]
        default: "1"

permissions:
  contents: read

jobs:
  evaluate:
    name: Evaluate the deployed prototype
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    # Never alongside a deploy: a restart mid-run would fail the packs it was on
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      INSTANCE_ID: ${{ vars.DEPLOY_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
      - name: Is the server running?
        run: |
          state=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' --output text)
          if [ "$state" != running ]; then
            echo "::error::The server is $state. Run the Start server workflow first, then this one."
            exit 1
          fi
      - uses: ./.github/actions/server-command
        with:
          instance-id: ${{ env.INSTANCE_ID }}
          document: ${{ vars.EVALUATE_DOCUMENT || 'gldb-evaluate' }}
          parameters: >-
            {"aiTeam": ["${{ inputs.ai-team && 'on' || 'off' }}"], "runs": ["${{ inputs.runs }}"]}
          what: Evaluation
          wait-minutes: "125"
      - run: echo "::notice::Saved. The server's Model & controls page shows the new results."
