AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  GLDB prototype - lets GitHub Actions start the prototype server, deploy
  main to it and evaluate it. GitHub signs in through OIDC (no stored AWS
  keys), and the role it gets can start one server and run two fixed commands
  on it (deploy, evaluate), and nothing else.

Parameters:
  # GitHub names the repository by owner and repository IDs as well as names,
  # so a deleted and re-created repository of the same name cannot deploy.
  # Read it with: gh api repos/OWNER/NAME/actions/oidc/customization/sub
  GitHubSubjectPrefix:
    Type: String
    Default: repo:TerrorByter@90329495/VeriDoc@1436987636
    Description: The repository's OIDC subject claim prefix (sub_claim_prefix)
  InstanceId:
    Type: AWS::EC2::Instance::Id
    Default: i-0fcef1c4a5013ea1e
    Description: The prototype server

Resources:
  GitHubOidc:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  # The only command the deploy role may run: pull main, install, build,
  # restart, and fail unless the API answers again
  DeployDocument:
    Type: AWS::SSM::Document
    Properties:
      Name: gldb-deploy
      DocumentType: Command
      UpdateMethod: NewVersion
      Content:
        schemaVersion: "2.2"
        description: Pull main on the prototype server, rebuild it and restart the app
        mainSteps:
          - action: aws:runShellScript
            name: deploy
            inputs:
              timeoutSeconds: "900"
              runCommand:
                - |
                  set -eu
                  sudo -u ubuntu -H bash -c 'set -euo pipefail
                  cd /opt/gldb
                  export PATH="$HOME/.local/bin:$PATH"
                  git pull --ff-only
                  uv pip install --quiet -r requirements.txt
                  cd frontend
                  npm ci --no-audit --no-fund --loglevel=error
                  npm run build'
                  systemctl restart gldb-records gldb-api
                  for i in $(seq 1 30); do
                    if curl -fs -o /dev/null http://127.0.0.1:8000/api/packs; then
                      echo "Deployed: $(sudo -u ubuntu git -C /opt/gldb log --oneline -1)"
                      exit 0
                    fi
                    sleep 1
                  done
                  echo "The API did not come back after the restart" >&2
                  exit 1

  # The evaluation: score the deployed code against every demo pack and save
  # the reports the controls page shows. The rules evaluation costs nothing;
  # the AI team, when asked for, calls Bedrock for every pack and run. Both
  # parameters allow fixed values only, so nothing else can be run through it.
  EvaluateDocument:
    Type: AWS::SSM::Document
    Properties:
      Name: gldb-evaluate
      DocumentType: Command
      UpdateMethod: NewVersion
      Content:
        schemaVersion: "2.2"
        description: Evaluate the deployed prototype against its demo packs and save the reports
        parameters:
          aiTeam:
            type: String
            description: Also run the AI team over every pack (calls Bedrock)
            allowedValues: ["off", "on"]
            default: "off"
          runs:
            type: String
            description: How many times the AI team runs each pack
            allowedValues: ["1", "2", "3"]
            default: "1"
          only:
            type: String
            description: Which pack the AI team runs (all, or one)
            allowedValues: ["all", "clean", "identity_mismatch", "incomplete", "inflated_financials",
                            "invoice_mismatch", "related_party", "round_trip", "sanctioned", "split_payment",
                            "struck_off", "tampered_statement", "third_party_payment"]
            default: "all"
        mainSteps:
          - action: aws:runShellScript
            name: evaluate
            inputs:
              timeoutSeconds: "7200"
              runCommand:
                - |
                  set -eu
                  sudo -u ubuntu -H bash -c 'set -uo pipefail
                  cd /opt/gldb
                  echo "Evaluating $(git log --oneline -1)"
                  status=0
                  # Exit 1 means a pack differs from its ground truth: the report is still saved
                  .venv/bin/python -m gldb.evaluate --save || status=$?
                  if [ "{{ aiTeam }}" = on ]; then
                    if [ "{{ only }}" = "all" ]; then
                      .venv/bin/python -m gldb.agent_eval --save --runs {{ runs }} || status=$?
                    else
                      .venv/bin/python -m gldb.agent_eval --save --runs {{ runs }} --only "{{ only }}" || status=$?
                    fi
                  fi
                  exit $status'

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: gldb-github-deploy
      Description: Assumed by GitHub Actions on main to start and deploy the prototype server
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidc
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub ${GitHubSubjectPrefix}:ref:refs/heads/main
      Policies:
        - PolicyName: deploy-prototype
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: RunTheDeployAndEvaluateCommandsOnTheServer
                Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${InstanceId}
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:document/${DeployDocument}
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:document/${EvaluateDocument}
              # The Start server workflow; stopping is left to infra/server-schedule.yaml
              - Sid: StartTheServer
                Effect: Allow
                Action: ec2:StartInstances
                Resource: !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${InstanceId}
              # Neither action supports resource-level permissions
              - Sid: ReadServerStateAndCommandResult
                Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ssm:GetCommandInvocation
                Resource: "*"

Outputs:
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
  DeployDocument:
    Value: !Ref DeployDocument
  EvaluateDocument:
    Value: !Ref EvaluateDocument
